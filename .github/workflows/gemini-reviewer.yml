name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    name: Run Gemini PR Reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PR Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Recommended models: 'gemini-1.5-flash', 'gemini-2.5-flash', 'gemini-2.5-pro'
          GEMINI_MODEL: 'gemini-2.5-flash'
          # Optional: Custom prompt guidelines for your project
          CUSTOM_PROMPT: ''
        run: node .github/scripts/gemini_reviewer.js
